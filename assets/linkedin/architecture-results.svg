<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">RSNA knee MRI study — architecture and result</title>
  <desc id="desc">A real sagittal knee MRI from Wikimedia Commons is shown as an illustrative scan, clearly separate from the research cohort. A simple diagram shows audited DICOM preprocessing, ConvNeXt-Tiny encoding, finding-specific attention for 12 predictions, and a rank ensemble reaching 0.8918 macro-AUC on a weak-label development set.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}.ink{fill:#172b3a}.muted{fill:#5e6d77}.teal{fill:#087f83}.line{stroke:#cbd4d8;stroke-width:2}.card{fill:#fff;stroke:#d4dce0;stroke-width:2}
  </style>
  <rect width="1600" height="900" fill="#f7f8f7"/>
  <text x="76" y="76" class="teal" font-size="18" font-weight="700" letter-spacing="2">RSNA KNEE MRI  /  EXPERIMENT SNAPSHOT</text>
  <text x="76" y="135" class="ink" font-size="42" font-weight="700">From MRI slices to 12 finding scores</text>
  <text x="76" y="174" class="muted" font-size="21">Our pipeline, experiments and measured development result</text>

  <!-- Authentic public MRI image, separated from the model diagram -->
  <rect x="76" y="218" width="440" height="500" rx="8" fill="#111"/>
  <image x="76" y="218" width="440" height="500" preserveAspectRatio="xMidYMid slice" xlink:href="https://upload.wikimedia.org/wikipedia/commons/e/e2/Knee_MRI_T1_TSE_Sagittal.jpg"/>
  <rect x="76" y="658" width="440" height="60" fill="#101820" fill-opacity=".88"/>
  <text x="96" y="684" fill="#fff" font-size="16" font-weight="700">SAGITTAL KNEE MRI · T1 TSE</text>
  <text x="96" y="706" fill="#d3dde2" font-size="13">Illustrative public image; not from our study cohort</text>

  <!-- restrained architecture -->
  <text x="574" y="236" class="ink" font-size="20" font-weight="700">MODEL PIPELINE</text>
  <line x1="602" y1="288" x2="602" y2="578" stroke="#9baab1" stroke-width="2"/>
  <g>
    <circle cx="602" cy="300" r="7" fill="#087f83"/>
    <rect x="630" y="268" width="844" height="66" rx="6" class="card"/>
    <text x="656" y="296" class="ink" font-size="19" font-weight="700">1  DICOM quality and geometry checks</text>
    <text x="656" y="320" class="muted" font-size="16">Series ordering · orientation · intensity normalization · 3-slice windows</text>

    <circle cx="602" cy="382" r="7" fill="#087f83"/>
    <rect x="630" y="350" width="844" height="66" rx="6" class="card"/>
    <text x="656" y="378" class="ink" font-size="19" font-weight="700">2  ConvNeXt-Tiny image encoder</text>
    <text x="656" y="402" class="muted" font-size="16">ImageNet initialization; no RSNA/knee-trained public checkpoint</text>

    <circle cx="602" cy="464" r="7" fill="#087f83"/>
    <rect x="630" y="432" width="844" height="66" rx="6" class="card"/>
    <text x="656" y="460" class="ink" font-size="19" font-weight="700">3  Finding-specific attention</text>
    <text x="656" y="484" class="muted" font-size="16">Pool image-window evidence into 12 independent finding predictions</text>

    <circle cx="602" cy="546" r="7" fill="#087f83"/>
    <rect x="630" y="514" width="844" height="66" rx="6" class="card"/>
    <text x="656" y="542" class="ink" font-size="19" font-weight="700">4  Predeclared rank ensemble</text>
    <text x="656" y="566" class="muted" font-size="16">Combine complementary experiment runs using fixed validation protocol</text>
  </g>

  <!-- result and progression -->
  <rect x="574" y="616" width="900" height="102" rx="8" fill="#e9f1f0"/>
  <text x="606" y="656" class="teal" font-size="15" font-weight="700" letter-spacing="1.4">FIXED WEAK-LABEL DEVELOPMENT SET · 885 STUDIES / 843 GROUPS</text>
  <text x="606" y="701" class="ink" font-size="42" font-weight="700">0.8918</text>
  <text x="780" y="696" class="muted" font-size="18">macro-AUC · experimental ensemble · not leaderboard</text>
  <text x="76" y="772" class="muted" font-size="15">EXPERIMENT TRACK</text>
  <text x="322" y="772" class="ink" font-size="16">N1  0.8868</text>
  <text x="558" y="772" class="ink" font-size="16">N3a  0.8885</text>
  <text x="822" y="772" class="teal" font-size="16" font-weight="700">Ensemble  0.8918</text>

  <line x1="76" y1="809" x2="1524" y2="809" class="line"/>
  <text x="76" y="842" class="muted" font-size="14">Development metric; not clinical performance or private-test evidence.</text>
  <text x="1524" y="842" text-anchor="end" class="muted" font-size="13">MRI: Ptrump16 / Wikimedia Commons · CC BY-SA 4.0 · cropped for layout</text>
</svg>

