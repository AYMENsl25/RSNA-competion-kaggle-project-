<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">RSNA knee MRI study — MRI examples, architecture, result</title>
  <desc id="desc">Two real public sagittal MRI examples, T1 TSE and PD TSE fat-suppressed, appear beside a four-layer model diagram. The images are illustrative and not from our research cohort. The model pipeline uses audited DICOM preprocessing, ConvNeXt-Tiny initialized with ImageNet weights, finding-specific attention for 12 outputs, and a predeclared rank ensemble that reached 0.8918 macro-AUC on a weak-label development set.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}.ink{fill:#192b38}.muted{fill:#5c6b75}.teal{fill:#087d80}.card{fill:#fff;stroke:#d3dadd;stroke-width:2}
  </style>
  <rect width="1600" height="900" fill="#f8f9f8"/>
  <text x="76" y="72" class="teal" font-size="18" font-weight="700" letter-spacing="2">RSNA KNEE MRI  /  EXPERIMENT SNAPSHOT</text>
  <text x="76" y="132" class="ink" font-size="43" font-weight="700">How we built the 0.8918 result</text>
  <text x="76" y="171" class="muted" font-size="21">Real MRI examples, model layers, and our measured development result</text>

  <!-- MRI image gallery -->
  <rect x="76" y="210" width="526" height="454" rx="8" class="card"/>
  <text x="100" y="246" class="ink" font-size="19" font-weight="700">KNEE MRI EXAMPLES</text>
  <rect x="100" y="266" width="220" height="300" rx="3" fill="#111"/>
  <image x="100" y="266" width="220" height="300" preserveAspectRatio="xMidYMid slice" href="https://upload.wikimedia.org/wikipedia/commons/e/e2/Knee_MRI_T1_TSE_Sagittal.jpg"/>
  <rect x="352" y="266" width="220" height="300" rx="3" fill="#111"/>
  <image x="352" y="266" width="220" height="300" preserveAspectRatio="xMidYMid slice" href="https://upload.wikimedia.org/wikipedia/commons/d/dc/Knee_MRI_PD_TSE_FS_Sagittal.jpg"/>
  <text x="100" y="595" class="ink" font-size="16" font-weight="700">T1 TSE · SAGITTAL</text>
  <text x="352" y="595" class="ink" font-size="16" font-weight="700">PD TSE FS · SAGITTAL</text>
  <text x="100" y="631" class="muted" font-size="14">Public illustrative scans · not from our study cohort</text>

  <!-- Model layers -->
  <text x="648" y="230" class="ink" font-size="19" font-weight="700">OUR MODEL PIPELINE</text>
  <line x1="672" y1="269" x2="672" y2="636" stroke="#b3c0c4" stroke-width="2"/>
  <g>
    <circle cx="672" cy="298" r="8" fill="#087d80"/>
    <rect x="700" y="266" width="824" height="74" rx="6" class="card"/>
    <text x="726" y="296" class="ink" font-size="20" font-weight="700">1 · DICOM audit and preprocessing</text>
    <text x="726" y="323" class="muted" font-size="16">Series ordering · orientation · intensity normalization · 3-slice windows</text>

    <circle cx="672" cy="396" r="8" fill="#087d80"/>
    <rect x="700" y="364" width="824" height="74" rx="6" class="card"/>
    <text x="726" y="394" class="ink" font-size="20" font-weight="700">2 · ConvNeXt-Tiny image encoder</text>
    <text x="726" y="421" class="muted" font-size="16">ImageNet initialization · no open-source RSNA/knee checkpoint</text>

    <circle cx="672" cy="494" r="8" fill="#087d80"/>
    <rect x="700" y="462" width="824" height="74" rx="6" class="card"/>
    <text x="726" y="492" class="ink" font-size="20" font-weight="700">3 · Finding-specific attention</text>
    <text x="726" y="519" class="muted" font-size="16">Pool image-window evidence into 12 independent finding predictions</text>

    <circle cx="672" cy="592" r="8" fill="#087d80"/>
    <rect x="700" y="560" width="824" height="74" rx="6" class="card"/>
    <text x="726" y="590" class="ink" font-size="20" font-weight="700">4 · Predeclared rank ensemble</text>
    <text x="726" y="617" class="muted" font-size="16">Combine complementary experiment runs under a fixed validation protocol</text>
  </g>

  <!-- Result panel -->
  <rect x="76" y="700" width="1448" height="118" rx="8" fill="#eaf1f0"/>
  <text x="106" y="739" class="teal" font-size="15" font-weight="700" letter-spacing="1.3">WEAK-LABEL DEVELOPMENT SET · 885 STUDIES / 843 GROUPS</text>
  <text x="106" y="796" class="ink" font-size="50" font-weight="700">0.8918</text>
  <text x="300" y="793" class="muted" font-size="18">macro-AUC</text>
  <line x1="495" y1="727" x2="495" y2="795" stroke="#c2cecf" stroke-width="2"/>
  <text x="535" y="758" class="ink" font-size="18" font-weight="700">N1  0.8868</text>
  <text x="720" y="758" class="ink" font-size="18" font-weight="700">N3a  0.8885</text>
  <text x="945" y="758" class="teal" font-size="18" font-weight="700">Ensemble  0.8918</text>
  <text x="535" y="793" class="muted" font-size="16">Experimental result · not a leaderboard or clinical score</text>
  <text x="76" y="854" class="muted" font-size="14">MRI: Ptrump16 / Wikimedia Commons · CC BY-SA 4.0 · resized/cropped · this graphic shared under CC BY-SA 4.0</text>
  <text x="1524" y="854" text-anchor="end" class="muted" font-size="15">Source code and experiment evidence on GitHub</text>
</svg>

